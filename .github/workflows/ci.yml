name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.9.30"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev ruff check .
      - run: uv run --locked --extra dev ruff format --check .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra mcp --extra dev
      - run: uv run --locked --extra mcp --extra dev pytest

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - run: uv build
      - run: uv run --locked --extra dev python scripts/check_wheel_contents.py
      - name: Install the wheel and import it on the oldest and newest Python
        run: |
          for python in 3.11 3.14; do
            uv venv --python "$python" ".wheel-venv-$python"
            uv pip install --python ".wheel-venv-$python/bin/python" dist/*.whl
            ".wheel-venv-$python/bin/python" -I -c "from importlib.metadata import version; import synclaw; from synclaw.core.chem import matches_target; from synclaw.providers import load_provider_config; assert synclaw.__version__ == version('synclaw'); assert matches_target('CCO', 'OCC') is True; assert load_provider_config().providers"
          done
      - name: Check that a release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(uv run --locked python -c "import synclaw; print(synclaw.__version__)")
          test "${GITHUB_REF_NAME#v}" = "$version"
